  C5_EXIT:
    vendor: "conveyor"
    conveyor_id: 5
    physical_position: "C51"
    description: "Conveyor 5 exit position"

  C6_EXIT:
    vendor: "conveyor"
    conveyor_id: 6
    physical_position: "C61"
    description: "Conveyor 6 exit position"

  C7_EXIT:
    vendor: "conveyor"
    conveyor_id: 7
    physical_position: "C71"
    description: "Conveyor 7 exit position"

  C8_EXIT:
    vendor: "conveyor"
