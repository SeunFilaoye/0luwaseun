    physical_position: "C81"
    description: "Conveyor 8 exit position"

# ==================== EDGE MAPPINGS ====================
# Maps edges to vendor command templates
# Variables: {column}, {row}, {source}, {dest}
edge_mappings:
  # ==================== XARM1 EDGES ====================
  # ASRS → Conveyor 1
  - from: "ASRS_XARM1"
    to: "XARM1_CONV1_DROP"
    command_template: "XARM1 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR C1"
    vendor: "lite6"
    robot: "XARM1"

  # ASRS → Conveyor 2
  - from: "ASRS_XARM1"
    to: "XARM1_CONV2_DROP"
    command_template: "XARM1 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR C2"
    vendor: "lite6"
    robot: "XARM1"

  # Xarm1 drops → Conveyor pickups (conveyor transport, no command needed)
  - from: "XARM1_CONV1_DROP"
    to: "C1_PICKUP"
    command_template: null  # Conveyor transport, no robot command
    vendor: "conveyor"
    robot: null

  - from: "XARM1_CONV2_DROP"
    to: "C2_PICKUP"
    command_template: null  # Conveyor transport, no robot command
    vendor: "conveyor"
    robot: null

  # ==================== XARM2 EDGES ====================
  # ASRS → Conveyor 2
  - from: "ASRS_XARM2"
    to: "XARM2_CONV2_DROP"
    command_template: "XARM2 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR C2"
    vendor: "lite6"
    robot: "XARM2"

  # ASRS → Conveyor 3
  - from: "ASRS_XARM2"
    to: "XARM2_CONV3_DROP"
    command_template: "XARM2 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR C3"
    vendor: "lite6"
    robot: "XARM2"

  # Xarm2 drops → Conveyor pickups (conveyor transport, no command needed)
  - from: "XARM2_CONV2_DROP"
    to: "C2_PICKUP"
    command_template: null  # Conveyor transport, no robot command
    vendor: "conveyor"
    robot: null

  - from: "XARM2_CONV3_DROP"
    to: "C3_PICKUP"
    command_template: null  # Conveyor transport, no robot command
    vendor: "conveyor"
    robot: null

  # ==================== NIRYO ROBOT EDGES ====================
  # Example robot chain (modify based on actual robot configs)

  # R1: Conveyor pickup → R1 drop
  - from: "C1_PICKUP"
    to: "R1_D12"
    command_template: "R1 | PICKUP - C1 | DROP - D12"
    vendor: "niryo"
    robot: "R1"

  # R2: Conveyor pickup or R1 drop → R2 drop
  - from: "C1_PICKUP"
    to: "R2_D23"
    command_template: "R2 | PICKUP - C1 | DROP - D23"
    vendor: "niryo"
    robot: "R2"

  - from: "R1_D12"
    to: "R2_D23"
    command_template: "R2 | PICKUP - D12 | DROP - D23"
    vendor: "niryo"
    robot: "R2"

  # R3: R2 drop → R3 drop
  - from: "R2_D23"
    to: "R3_D34"
    command_template: "R3 | PICKUP - D23 | DROP - D34"
    vendor: "niryo"
    robot: "R3"

  # R4: R3 drop → R4 drop
  - from: "R3_D34"
    to: "R4_D45"
    command_template: "R4 | PICKUP - D34 | DROP - D45"
    vendor: "niryo"
    robot: "R4"

  # R5: R4 drop → R5 drop
  - from: "R4_D45"
    to: "R5_D56"
    command_template: "R5 | PICKUP - D45 | DROP - D56"
    vendor: "niryo"
    robot: "R5"

  # R6: R5 drop → R6 drop to exit
  - from: "R5_D56"
    to: "R6_D_EXIT"
    command_template: "R6 | PICKUP - D56 | DROP - EXIT"
    vendor: "niryo"
    robot: "R6"

  # ==================== EXIT EDGES ====================
  # R6 can drop to different conveyor exits
  - from: "R6_D_EXIT"
    to: "C1_EXIT"
    command_template: "R6 | PICKUP - EXIT | DROP - C1"
    vendor: "niryo"
    robot: "R6"

  - from: "R6_D_EXIT"
    to: "C2_EXIT"
    command_template: "R6 | PICKUP - EXIT | DROP - C2"
    vendor: "niryo"
    robot: "R6"

  - from: "R6_D_EXIT"
    to: "C3_EXIT"
    command_template: "R6 | PICKUP - EXIT | DROP - C3"
    vendor: "niryo"
    robot: "R6"

  # Add more exit edges based on which robots can reach which exits

