# ==================== EDGE MAPPINGS ====================
# Maps edges to vendor command templates
# Variables: {column}, {row} are substituted from ASRS location (e.g. C1R1 → column=C1, row=R1)
# Conveyor edges with null command_template represent passive transport (no robot command)
edge_mappings:
  # ==================== ROUTE 1: XARM1_C1 → RED_BIN ====================
  - from: "XARM1_C1"
    to: "XARM1_CONV1_DROP"
    command_template: "XARM1 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR 1"
    vendor: "lite6"
    robot: "XARM1"

  - from: "XARM1_CONV1_DROP"
    to: "C1_PICKUP"
    command_template: null
    vendor: "conveyor"
    robot: null

  - from: "C1_PICKUP"
    to: "C5_PICKUP"
    command_template: "R1 | PICKUP - P11 | DROP - D15"
    vendor: "niryo"
    robot: "R1"

  # ==================== ROUTE 2: XARM2_C4 → BLUE_BIN ====================
  # Alternative: XARM2_C4 → Conveyor 2 (used by part_6 → YELLOW_BIN via Route 6 path)
  - from: "XARM2_C4"
    to: "XARM2_CONV2_DROP"
    command_template: "XARM2 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR 2"
    vendor: "lite6"
    robot: "XARM2"

  - from: "XARM2_C4"
    to: "XARM2_AGV_DROP"
    command_template: "XARM2 | PICKUP - ASRS {column} {row} | DROP - AGV A"
    vendor: "lite6"
    robot: "XARM2"

  - from: "XARM2_AGV_DROP"
    to: "AGV_NODE_D"
    command_template: "AGV1 | PICKUP - A | DROP - D"
    vendor: "agv"
    robot: null

  - from: "AGV_NODE_D"
    to: "BLUE_BIN"
    command_template: null
    vendor: "niryo"
    robot: "R6"
    # R6 is dispatched directly by superfactory._handle_agv_arrival when AGV arrives at D.
    # Keeping it null here avoids a second R6 execution from the trajectory queue.

  # ==================== ROUTE 3: XARM1_C2 → YELLOW_BIN ====================
  - from: "XARM1_C2"
    to: "XARM1_CONV2_DROP"
    command_template: "XARM1 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR 2"
    vendor: "lite6"
    robot: "XARM1"

  - from: "XARM1_CONV2_DROP"
    to: "C2_PICKUP"
    command_template: null
    vendor: "conveyor"
    robot: null

  - from: "C2_PICKUP"
    to: "C3_PICKUP"
    command_template: "R1 | PICKUP - P12 | DROP - D13"
    vendor: "niryo"
    robot: "R1"

  - from: "C3_PICKUP"
    to: "C7_PICKUP"
    command_template: "R2 | PICKUP - P13 | DROP - D17"
    vendor: "niryo"
    robot: "R2"

  - from: "C7_PICKUP"
    to: "YELLOW_BIN"
    command_template: "R5 | PICKUP - P17 | DROP - D13"
    vendor: "niryo"
    robot: "R5"

  # ==================== ROUTE 4: XARM2_C5 → BLUE_BIN ====================
  - from: "XARM2_C5"
    to: "XARM2_CONV4_DROP"
    command_template: "XARM2 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR 4"
    vendor: "lite6"
    robot: "XARM2"

  - from: "XARM2_CONV4_DROP"
    to: "C4_PICKUP"
    command_template: null
    vendor: "conveyor"
    robot: null

  - from: "C4_PICKUP"
    to: "C8_PICKUP"
    command_template: "R3 | PICKUP - P14 | DROP - D18"
    vendor: "niryo"
    robot: "R3"

  - from: "C8_PICKUP"
    to: "BLUE_BIN"
    command_template: "R6 | PICKUP - P18 | DROP - D11"
    vendor: "niryo"
    robot: "R6"

  # ==================== ROUTE 5: XARM1_C3 → RED_BIN ====================
  # (shares XARM1_CONV2_DROP→C2_PICKUP with route 3)
  - from: "XARM1_C3"
    to: "XARM1_CONV2_DROP"
    command_template: "XARM1 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR 2"
    vendor: "lite6"
    robot: "XARM1"

  - from: "C2_PICKUP"
    to: "C5_PICKUP"
    command_template: "R1 | PICKUP - P12 | DROP - D15"
    vendor: "niryo"
    robot: "R1"

  - from: "C5_PICKUP"
    to: "C6_PICKUP"
    command_template: "R4 | PICKUP - P15 | DROP - D16"
    vendor: "niryo"
    robot: "R4"

  - from: "C6_PICKUP"
    to: "RED_BIN"
    command_template: "R4 | PICKUP - P16 | DROP - D12"
    vendor: "niryo"
    robot: "R4"

  # ==================== ROUTE 6: XARM2_C6 → YELLOW_BIN ====================
  # (shares C2→C3→C7→YELLOW_BIN with route 3)
  - from: "XARM2_C6"
    to: "XARM2_CONV2_DROP"
    command_template: "XARM2 | PICKUP - ASRS {column} {row} | DROP - CONVEYOR 2"
    vendor: "lite6"
    robot: "XARM2"

  - from: "XARM2_CONV2_DROP"
    to: "C2_PICKUP"
    command_template: null
    vendor: "conveyor"
    robot: null

  # ==================== ROUTE 7: XARM1_C1 → AGV2 → RED_BIN ====================
  - from: "XARM1_C1"
    to: "XARM1_AGV2_DROP"
    command_template: "XARM1 | PICKUP - ASRS {column} {row} | DROP - AGV2 A"
    vendor: "lite6"
    robot: "XARM1"

  - from: "XARM1_AGV2_DROP"
    to: "AGV2_NODE_D"
    command_template: "AGV4 | PICKUP - A | DROP - D"
    vendor: "agv2"
    robot: null

  - from: "AGV2_NODE_D"
    to: "RED_BIN"
    command_template: null
    vendor: "niryo"
    robot: "R4"
    # R4 is dispatched by superfactory._handle_agv2_arrival when AGV2 arrives at D.
