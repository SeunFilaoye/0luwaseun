# Node to Physical Mapping Configuration
# This file maps abstract graph nodes to physical vendor commands

# ==================== NODE MAPPINGS ====================
# Maps individual nodes to their physical attributes
node_mappings:
  # ASRS Origin Nodes
  ASRS_XARM1:
    vendor: "lite6"
    robot: "XARM1"
    pickup_location: "ASRS"
    description: "ASRS access point for Xarm1"

  ASRS_XARM2:
    vendor: "lite6"
    robot: "XARM2"
    pickup_location: "ASRS"
    description: "ASRS access point for Xarm2"

  # Lite6 Drop-off Positions
  XARM1_CONV1_DROP:
    vendor: "lite6"
    robot: "XARM1"
    drop_location: "CONVEYOR"
    conveyor: "C1"
    description: "Xarm1 drop to Conveyor 1"

  XARM1_CONV2_DROP:
    vendor: "lite6"
    robot: "XARM1"
    drop_location: "CONVEYOR"
    conveyor: "C2"
    description: "Xarm1 drop to Conveyor 2"

  XARM2_CONV2_DROP:
    vendor: "lite6"
    robot: "XARM2"
    drop_location: "CONVEYOR"
    conveyor: "C2"
    description: "Xarm2 drop to Conveyor 2"

  XARM2_CONV3_DROP:
    vendor: "lite6"
    robot: "XARM2"
    drop_location: "CONVEYOR"
    conveyor: "C3"
    description: "Xarm2 drop to Conveyor 3"

  # Conveyor Pickup Positions (C<n>2 format in physical system)
  C1_PICKUP:
    vendor: "conveyor"
    conveyor_id: 1
    physical_position: "C12"
    description: "Conveyor 1 pickup position"

  C2_PICKUP:
    vendor: "conveyor"
    conveyor_id: 2
    physical_position: "C22"
    description: "Conveyor 2 pickup position"

  C3_PICKUP:
    vendor: "conveyor"
    conveyor_id: 3
    physical_position: "C32"
    description: "Conveyor 3 pickup position"

  C4_PICKUP:
    vendor: "conveyor"
    conveyor_id: 4
    physical_position: "C42"
    description: "Conveyor 4 pickup position"

  C5_PICKUP:
    vendor: "conveyor"
    conveyor_id: 5
    physical_position: "C52"
    description: "Conveyor 5 pickup position"

  C6_PICKUP:
    vendor: "conveyor"
    conveyor_id: 6
    physical_position: "C62"
    description: "Conveyor 6 pickup position"

  C7_PICKUP:
    vendor: "conveyor"
    conveyor_id: 7
    physical_position: "C72"
    description: "Conveyor 7 pickup position"

  C8_PICKUP:
    vendor: "conveyor"
    conveyor_id: 8
    physical_position: "C82"
    description: "Conveyor 8 pickup position"

  # Niryo Robot Positions (examples - replace with actual positions from configs)
  R1_P11:
    vendor: "niryo"
    robot: "R1"
    position_key: "P11"
    description: "Robot 1 pickup position"

  R1_D12:
    vendor: "niryo"
    robot: "R1"
    position_key: "D12"
    description: "Robot 1 drop position"

  R2_P12:
    vendor: "niryo"
    robot: "R2"
    position_key: "P12"
    description: "Robot 2 pickup position"

  R2_D23:
    vendor: "niryo"
    robot: "R2"
    position_key: "D23"
    description: "Robot 2 drop position"

  R3_P23:
    vendor: "niryo"
    robot: "R3"
    position_key: "P23"
    description: "Robot 3 pickup position"

  R3_D34:
    vendor: "niryo"
    robot: "R3"
    position_key: "D34"
    description: "Robot 3 drop position"

  R4_P34:
    vendor: "niryo"
    robot: "R4"
    position_key: "P34"
    description: "Robot 4 pickup position"

  R4_D45:
    vendor: "niryo"
    robot: "R4"
    position_key: "D45"
    description: "Robot 4 drop position"

  R5_P45:
    vendor: "niryo"
    robot: "R5"
    position_key: "P45"
    description: "Robot 5 pickup position"

  R5_D56:
    vendor: "niryo"
    robot: "R5"
    position_key: "D56"
    description: "Robot 5 drop position"

  R6_P56:
    vendor: "niryo"
    robot: "R6"
    position_key: "P56"
    description: "Robot 6 pickup position"

  R6_D_EXIT:
    vendor: "niryo"
    robot: "R6"
    position_key: "D_EXIT"
    description: "Robot 6 drop to exit"

  # Conveyor Exit Positions (C<n>1 format in physical system)
  C1_EXIT:
    vendor: "conveyor"
    conveyor_id: 1
    physical_position: "C11"
    description: "Conveyor 1 exit position"

  C2_EXIT:
    vendor: "conveyor"
