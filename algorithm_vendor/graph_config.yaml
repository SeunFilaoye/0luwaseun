# Testbed Graph Configuration
# This file defines the nodes and edges representing the physical testbed

nodes:
  # ==================== ORIGIN NODES (ASRS) ====================
  # ASRS represented as 2 origin nodes (one per Xarm)

  - id: "ASRS_XARM1"
    type: "origin"
    vendor: "lite6"
    capacity: 1
    description: "ASRS access for Xarm1 (columns 1-3)"

  - id: "ASRS_XARM2"
    type: "origin"
    vendor: "lite6"
    capacity: 1
    description: "ASRS access for Xarm2 (columns 4-6)"

  # ==================== LITE6 DROP-OFF POSITIONS ====================
  # 4 explicit nodes for Xarm drop-off positions

  - id: "XARM1_CONV1_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM1"
    capacity: 1
    description: "Xarm1 drop-off to Conveyor 1"

  - id: "XARM1_CONV2_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM1"
    capacity: 1
    description: "Xarm1 drop-off to Conveyor 2"

  - id: "XARM2_CONV2_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM2"
    capacity: 1
    description: "Xarm2 drop-off to Conveyor 2"

  - id: "XARM2_CONV3_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM2"
    capacity: 1
    description: "Xarm2 drop-off to Conveyor 3"

  # ==================== CONVEYOR PICKUP POSITIONS ====================
  # 8 conveyors, each has pickup position (C<n>2 format)

  - id: "C1_PICKUP"  # C12 in physical system
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 1
    capacity: 1
    description: "Conveyor 1 pickup position"

  - id: "C2_PICKUP"  # C22
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 2
    capacity: 1
    description: "Conveyor 2 pickup position"

  - id: "C3_PICKUP"  # C32
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 3
    capacity: 1
    description: "Conveyor 3 pickup position"

  - id: "C4_PICKUP"  # C42
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 4
    capacity: 1
    description: "Conveyor 4 pickup position"

  - id: "C5_PICKUP"  # C52
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 5
    capacity: 1
    description: "Conveyor 5 pickup position"

  - id: "C6_PICKUP"  # C62
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 6
    capacity: 1
    description: "Conveyor 6 pickup position"

  - id: "C7_PICKUP"  # C72
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 7
    capacity: 1
    description: "Conveyor 7 pickup position"

  - id: "C8_PICKUP"  # C82
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 8
    capacity: 1
    description: "Conveyor 8 pickup position"

  # ==================== NIRYO ROBOT POSITIONS ====================
  # Positions defined per robot based on their config files
  # Format: R<robot_id>_<position_key>
  # You'll fill these based on each robot's actual pickup/drop positions

  # Robot 1 positions (example - replace with actual positions from config)
  - id: "R1_P11"
    type: "pickup"
    vendor: "niryo"
    robot: "R1"
    capacity: 1
    description: "Robot 1 pickup position P11"

  - id: "R1_D12"
    type: "dropoff"
    vendor: "niryo"
    robot: "R1"
    capacity: 1
    description: "Robot 1 drop position D12"

  # Robot 2 positions
  - id: "R2_P12"
    type: "pickup"
    vendor: "niryo"
    robot: "R2"
    capacity: 1
    description: "Robot 2 pickup position P12"

  - id: "R2_D23"
    type: "dropoff"
    vendor: "niryo"
    robot: "R2"
    capacity: 1
    description: "Robot 2 drop position D23"

  # Robot 3 positions
  - id: "R3_P23"
    type: "pickup"
    vendor: "niryo"
    robot: "R3"
    capacity: 1
    description: "Robot 3 pickup position P23"

  - id: "R3_D34"
    type: "dropoff"
    vendor: "niryo"
    robot: "R3"
    capacity: 1
    description: "Robot 3 drop position D34"

  # Robot 4 positions
  - id: "R4_P34"
    type: "pickup"
    vendor: "niryo"
    robot: "R4"
    capacity: 1
    description: "Robot 4 pickup position P34"

  - id: "R4_D45"
    type: "dropoff"
    vendor: "niryo"
    robot: "R4"
    capacity: 1
    description: "Robot 4 drop position D45"

  # Robot 5 positions
  - id: "R5_P45"
    type: "pickup"
