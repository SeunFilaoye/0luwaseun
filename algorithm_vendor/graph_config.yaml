# Testbed Graph Configuration — 6-Route Topology
# Nodes and edges representing the physical testbed for all 6 routes

nodes:
  # ==================== XARM ORIGIN NODES (per ASRS column) ====================
  # One origin node per ASRS column — determines which xarm and which conveyor drop

  - id: "XARM1_C1"
    type: "origin"
    vendor: "lite6"
    robot: "XARM1"
    asrs_column: 1
    description: "XARM1 picks from ASRS column 1 → drops to Conveyor 1"

  - id: "XARM1_C2"
    type: "origin"
    vendor: "lite6"
    robot: "XARM1"
    asrs_column: 2
    description: "XARM1 picks from ASRS column 2 → drops to Conveyor 2"

  - id: "XARM1_C3"
    type: "origin"
    vendor: "lite6"
    robot: "XARM1"
    asrs_column: 3
    description: "XARM1 picks from ASRS column 3 → drops to Conveyor 2"

  - id: "XARM2_C4"
    type: "origin"
    vendor: "lite6"
    robot: "XARM2"
    asrs_column: 4
    description: "XARM2 picks from ASRS column 4 → drops to AGV"

  - id: "XARM2_C5"
    type: "origin"
    vendor: "lite6"
    robot: "XARM2"
    asrs_column: 5
    description: "XARM2 picks from ASRS column 5 → drops to Conveyor 4"

  - id: "XARM2_C6"
    type: "origin"
    vendor: "lite6"
    robot: "XARM2"
    asrs_column: 6
    description: "XARM2 picks from ASRS column 6 → drops to Conveyor 2"

  # ==================== XARM DROP NODES ====================

  - id: "XARM1_CONV1_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM1"
    description: "XARM1 drop-off point for Conveyor 1"

  - id: "XARM1_CONV2_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM1"
    description: "XARM1 drop-off point for Conveyor 2 (routes 3 and 5)"

  - id: "XARM2_AGV_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM2"
    description: "XARM2 drop-off point for AGV (route 2)"

  - id: "XARM2_CONV4_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM2"
    description: "XARM2 drop-off point for Conveyor 4 (route 4)"

  - id: "XARM2_CONV2_DROP"
    type: "dropoff"
    vendor: "lite6"
    robot: "XARM2"
    description: "XARM2 drop-off point for Conveyor 2 (route 6)"

  # ==================== AGV INTERMEDIATE NODE ====================

  - id: "AGV_NODE_D"
    type: "pickup"
    vendor: "agv"
    description: "AGV node D — R6 picks from here (route 2)"

  # ==================== CONVEYOR PICKUP NODES ====================

  - id: "C1_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 1
    description: "Conveyor 1 pickup position (route 1: R1 picks here)"

  - id: "C2_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 2
    description: "Conveyor 2 pickup position (routes 3,5,6: fork to C3 or C5)"

  - id: "C3_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 3
    description: "Conveyor 3 pickup position (routes 3,6: R2 picks here)"

  - id: "C4_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 4
    description: "Conveyor 4 pickup position (route 4: R3 picks here)"

  - id: "C5_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 5
    description: "Conveyor 5 pickup position (routes 1,5: R4 picks here)"

  - id: "C6_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 6
    description: "Conveyor 6 pickup position (routes 1,5: R4 second pick here)"

  - id: "C7_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 7
    description: "Conveyor 7 pickup position (routes 3,6: R5 picks here)"

  - id: "C8_PICKUP"
    type: "pickup"
    vendor: "conveyor"
    conveyor_id: 8
    description: "Conveyor 8 pickup position (route 4: R6 picks here)"

  # ==================== EXIT NODES ====================

  - id: "RED_BIN"
    type: "exit"
    vendor: "niryo"
    robot: "R4"
    description: "Red bin exit — R4 drops to D12 (routes 1 and 5)"

  - id: "YELLOW_BIN"
    type: "exit"
    vendor: "niryo"
    robot: "R5"
    description: "Yellow bin exit — R5 drops to D13 (routes 3 and 6)"

  - id: "BLUE_BIN"
    type: "exit"
    vendor: "niryo"
    robot: "R6"
    description: "Blue bin exit — R6 drops to D11 (routes 2 and 4)"

# ==================== EDGES ====================
edges:
  # ==================== ROUTE 1: XARM1_C1 → RED_BIN ====================
  # XARM1 picks C1R1, drops to Conveyor 1, R1→C5, R4→C6, R4→RED_BIN

  - from: "XARM1_C1"
    to: "XARM1_CONV1_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM1"

  - from: "XARM1_CONV1_DROP"
    to: "C1_PICKUP"
    travel_time: 0.5
    bidirectional: false
    vendor: "conveyor"
    robot: null

  - from: "C1_PICKUP"
    to: "C5_PICKUP"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R1"

  # ==================== ROUTE 2: XARM2_C4 → BLUE_BIN ====================
  # XARM2 picks C4R1, drops to AGV, AGV→Node_D, R6→BLUE_BIN

  - from: "XARM2_C4"
    to: "XARM2_AGV_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM2"

  - from: "XARM2_AGV_DROP"
    to: "AGV_NODE_D"
    travel_time: 2.0
    bidirectional: false
    vendor: "agv"
    robot: null

  - from: "AGV_NODE_D"
    to: "BLUE_BIN"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R6"

  # ==================== ROUTE 3: XARM1_C2 → YELLOW_BIN ====================
  # XARM1 picks C2R1, drops to Conveyor 2, R1→C3, R2→C7, R5→YELLOW_BIN

  - from: "XARM1_C2"
    to: "XARM1_CONV2_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM1"

  - from: "XARM1_CONV2_DROP"
    to: "C2_PICKUP"
    travel_time: 0.5
    bidirectional: false
    vendor: "conveyor"
    robot: null

  - from: "C2_PICKUP"
    to: "C3_PICKUP"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R1"

  - from: "C3_PICKUP"
    to: "C7_PICKUP"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R2"

  - from: "C7_PICKUP"
    to: "YELLOW_BIN"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R5"

  # ==================== ROUTE 4: XARM2_C5 → BLUE_BIN ====================
  # XARM2 picks C5R1, drops to Conveyor 4, R3→C8, R6→BLUE_BIN

  - from: "XARM2_C5"
    to: "XARM2_CONV4_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM2"

  - from: "XARM2_CONV4_DROP"
    to: "C4_PICKUP"
    travel_time: 0.5
    bidirectional: false
    vendor: "conveyor"
    robot: null

  - from: "C4_PICKUP"
    to: "C8_PICKUP"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R3"

  - from: "C8_PICKUP"
    to: "BLUE_BIN"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R6"

  # ==================== ROUTE 5: XARM1_C3 → RED_BIN ====================
  # XARM1 picks C3R1, drops to Conveyor 2, R1→C5, R4→C6, R4→RED_BIN
  # Shares XARM1_CONV2_DROP→C2_PICKUP with route 3
  # Shares C5→C6→RED_BIN with route 1

  - from: "XARM1_C3"
    to: "XARM1_CONV2_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM1"

  - from: "C2_PICKUP"
    to: "C5_PICKUP"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R1"

  - from: "C5_PICKUP"
    to: "C6_PICKUP"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R4"

  - from: "C6_PICKUP"
    to: "RED_BIN"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R4"

  # ==================== ROUTE 6: XARM2_C6 → YELLOW_BIN ====================
  # XARM2 picks C6R1, drops to Conveyor 2, R1→C3, R2→C7, R5→YELLOW_BIN
  # Shares C2→C3→C7→YELLOW_BIN with route 3

  - from: "XARM2_C6"
    to: "XARM2_CONV2_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM2"

  - from: "XARM2_CONV2_DROP"
    to: "C2_PICKUP"
    travel_time: 0.5
    bidirectional: false
    vendor: "conveyor"
    robot: null
