  - id: "R5_D56"
    type: "dropoff"
    vendor: "niryo"
    robot: "R5"
    capacity: 1
    description: "Robot 5 drop position D56"

  # Robot 6 positions
  - id: "R6_P56"
    type: "pickup"
    vendor: "niryo"
    robot: "R6"
    capacity: 1
    description: "Robot 6 pickup position P56"

  - id: "R6_D_EXIT"
    type: "dropoff"
    vendor: "niryo"
    robot: "R6"
    capacity: 1
    description: "Robot 6 drop to exit"

  # ==================== CONVEYOR DROP-OFF/EXIT POSITIONS ====================
  # 8 conveyors, each has drop-off position (C<n>1 format)

  - id: "C1_EXIT"  # C11 in physical system
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 1
    capacity: 1
    description: "Conveyor 1 exit/drop position"

  - id: "C2_EXIT"  # C21
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 2
    capacity: 1
    description: "Conveyor 2 exit/drop position"

  - id: "C3_EXIT"  # C31
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 3
    capacity: 1
