  - id: "C8_EXIT"  # C81
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 8
    capacity: 1
    description: "Conveyor 8 exit/drop position"

# ==================== EDGES ====================
edges:
  # ==================== XARM1 EDGES ====================
  # Xarm1: ASRS → Conveyor 1 drop
  - from: "ASRS_XARM1"
    to: "XARM1_CONV1_DROP"
    travel_time: 1.0  # Placeholder unit time
    bidirectional: false
    vendor: "lite6"
    robot: "XARM1"

  # Xarm1: ASRS → Conveyor 2 drop
  - from: "ASRS_XARM1"
    to: "XARM1_CONV2_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM1"

  # Xarm1 drops connect to conveyor pickups
  - from: "XARM1_CONV1_DROP"
    to: "C1_PICKUP"
    travel_time: 0.5  # Conveyor transport time
    bidirectional: false
    vendor: "conveyor"
    robot: null

  - from: "XARM1_CONV2_DROP"
    to: "C2_PICKUP"
    travel_time: 0.5
    bidirectional: false
    vendor: "conveyor"
    robot: null

  # ==================== XARM2 EDGES ====================
  # Xarm2: ASRS → Conveyor 2 drop
  - from: "ASRS_XARM2"
    to: "XARM2_CONV2_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM2"

  # Xarm2: ASRS → Conveyor 3 drop
  - from: "ASRS_XARM2"
    to: "XARM2_CONV3_DROP"
    travel_time: 1.0
    bidirectional: false
    vendor: "lite6"
    robot: "XARM2"

  # Xarm2 drops connect to conveyor pickups
  - from: "XARM2_CONV2_DROP"
    to: "C2_PICKUP"
    travel_time: 0.5
    bidirectional: false
    vendor: "conveyor"
    robot: null

  - from: "XARM2_CONV3_DROP"
    to: "C3_PICKUP"
    travel_time: 0.5
    bidirectional: false
    vendor: "conveyor"
    robot: null

  # ==================== NIRYO ROBOT EDGES ====================
  # Example robot chain (modify based on your actual robot configs)

  # R1: Conveyor pickup → R1 drop
  - from: "C1_PICKUP"
    to: "R1_D12"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R1"

  # R2: Conveyor pickup or R1 drop → R2 drop
  - from: "C1_PICKUP"
    to: "R2_D23"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R2"

  - from: "R1_D12"
    to: "R2_D23"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R2"

  # R3: R2 drop → R3 drop
  - from: "R2_D23"
    to: "R3_D34"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R3"

  # R4: R3 drop → R4 drop
  - from: "R3_D34"
    to: "R4_D45"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R4"

  # R5: R4 drop → R5 drop
  - from: "R4_D45"
    to: "R5_D56"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R5"

  # R6: R5 drop → R6 drop to exit
  - from: "R5_D56"
    to: "R6_D_EXIT"
    travel_time: 1.0
    bidirectional: false
    vendor: "niryo"
    robot: "R6"

  # ==================== EXIT EDGES ====================
  # Robots can drop to conveyor exits

  - from: "R6_D_EXIT"
    to: "C1_EXIT"
    travel_time: 0.5
    bidirectional: false
    vendor: "niryo"
    robot: "R6"

  - from: "R6_D_EXIT"
    to: "C2_EXIT"
    travel_time: 0.5
    bidirectional: false
    vendor: "niryo"
    robot: "R6"

  - from: "R6_D_EXIT"
    to: "C3_EXIT"
    travel_time: 0.5
    bidirectional: false
    vendor: "niryo"
    robot: "R6"

  # Add more edges based on which robots can reach which exits
  # This is where you define the actual connectivity based on your robot configs

