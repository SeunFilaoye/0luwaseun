  - id: "C4_EXIT"  # C41
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 4
    capacity: 1
    description: "Conveyor 4 exit/drop position"

  - id: "C5_EXIT"  # C51
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 5
    capacity: 1
    description: "Conveyor 5 exit/drop position"

  - id: "C6_EXIT"  # C61
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 6
    capacity: 1
    description: "Conveyor 6 exit/drop position"

  - id: "C7_EXIT"  # C71
    type: "exit"
    vendor: "conveyor"
    conveyor_id: 7
    capacity: 1
