# Niryo Conveyor Configurations
# CRITICAL: robot_namespace must match the physical robot panel the conveyor is connected to!

conveyor_1:
  robot_namespace: "robot1"        # ← NEW: Physical connection
  conveyor_hardware_id: 9
  speed: 70
  description: "Conveyor C1 - Feeds Robot R1 from X-arm1"
  
  sensors:
    forward:
      pin: "DI5"
      direction: 1
      triggers_robot: 1
      pickup_position: "P11"
      description: "Multipath flow, either C5 or C4"

conveyor_2:
  robot_namespace: "robot1"        # ← FIXED: C2 is on R1's panel (hardware_id 10)
  conveyor_hardware_id: 10
  speed: 70
  description: "Conveyor C2 - Feeds Robot R1 from X-arm1 or X-arm2"
  
  sensors:
    forward:
      pin: "DI3"
      direction: 1
      triggers_robot: 1
      pickup_position: "P12"
      description: "Multipath flow, either C5 or C4"

conveyor_3:
  robot_namespace: "robot2"        # ← FIXED: C3 is on R2's panel
  conveyor_hardware_id: 9
  speed: 70
  description: "Conveyor C3 - Feeds Robot R3 from X-arm2"
  
  sensors:
    forward:
      pin: "DI5"
      direction: 1
      triggers_robot: 2
      pickup_position: "P13"
      description: "Normal flow to R3"

conveyor_4:
  robot_namespace: "robot3"        # ← FIXED: C4 is on R3's panel
  conveyor_hardware_id: 9
  speed: 70
  description: "Conveyor C4 - Feeds Robot R3 from X-arm2 and Robot R4 from R1"
  
  sensors:
    forward:
      pin: "DI5"
      direction: 1
      triggers_robot: 3       # Logically triggers both R3 and R4
      pickup_position: "P14"
      description: "Normal flow to R3 or R4"

conveyor_5:
  robot_namespace: "robot4"        # ← FIXED: C5 is on R4's panel
  conveyor_hardware_id: 10
  speed: 70
  description: "Conveyor C5 - Feeds Robot R4 from R1"
  
  sensors:
    forward:
      pin: "DI1"
      direction: 1
      triggers_robot: 4
      pickup_position: "P15"
      description: "Normal forward flow to R4"

conveyor_6:
  robot_namespace: "robot4"        # ← FIXED: C6 is on R4's panel (hardware_id 10)
  conveyor_hardware_id: 9
  speed: 70
  description: "Conveyor C6 - Feeds Robot R5 from R4"
  
  sensors:
    forward:
      pin: "DI5"
      direction: 1
      triggers_robot: 4
      pickup_position: "P16"
      description: "Normal forward flow to R5"

conveyor_7:
  robot_namespace: "robot5"        # ← FIXED: C7 is on R5's panel
  conveyor_hardware_id: 9
  speed: 70
  description: "Conveyor C7 - Feeds Robot R5 from R2"
  
  sensors:
    forward:
      pin: "DI1"
      direction: 1
      triggers_robot: [5, 6]
      pickup_position: "P17"
      description: "Normal flow to R5 or R6"

conveyor_8:
  robot_namespace: "robot6"        # ← FIXED: C8 is on R6's panel
  conveyor_hardware_id: 9
  speed: 70
  description: "Conveyor C8 - Feeds Robot R6 from R3"
  
  sensors:
    forward:
      pin: "DI5"
      direction: 1
      triggers_robot: 6
      pickup_position: "P18"
      description: "Normal flow to R6"

# Configuration metadata
metadata:
  version: "1.1"
  date: "2024-12-23"
  description: "Conveyor configurations for Niryo vendor-agnostic testbed"
  
  # NEW: Physical topology documentation
  physical_topology:
    robot1: 
      conveyors: [1, 2]
      hardware_ids: [9, 10]
    robot2:
      conveyors: [3]
      hardware_ids: [9]
    robot3:
      conveyors: [4]
      hardware_ids: [9]
    robot4:
      conveyors: [5, 6]
      hardware_ids: [9, 10]
    robot5:
      conveyors: [7]
      hardware_ids: [9]
    robot6:
      conveyors: [8]
      hardware_ids: [9]
  
  # Hardware constraints
  hardware:
    speed_range: [0, 100]
    valid_directions: [1, -1]
    valid_sensor_pins: ["DI1", "DI2", "DI3", "DI4", "DI5"]
    max_conveyors_per_robot: 2
  
  # Supported configurations
  supported_types:
    single_direction: "Single sensor, one direction (most common)"
    bi_directional: "Two sensors, two directions (special cases)"
  
  # Direction naming conventions
  direction_names:
    - "forward"
    - "reverse"
    - "primary"
    - "secondary"
  
  # Notes
  notes:
    - "robot_namespace MUST match the physical robot's ROS2 namespace"
    - "conveyor_hardware_id determines which port on that robot's panel (9 or 10)"
    - "triggers_robot is LOGICAL - which robot(s) should be notified by Factory"
    - "Each robot panel supports max 2 conveyors (hardware IDs 9 and 10)"