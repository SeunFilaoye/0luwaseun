# Configuration metadata
metadata:
  version: "1.0"
  date: "2024-12-22"
  coordinate_system: "DH_CONVENTION"
  joint_units: "radians"
  description: "Physical position configurations for Niryo NED2 robots in vendor-agnostic testbed"
  
  # Position type definitions
  position_types:
    HOME: "Default starting position for robot"
    HOLD: "Safe holding position with object secured"
    PICKUP: "Position to pick object from surface/conveyor"
    DROP: "Position to drop object onto surface/conveyor"
    CAMERA: "Position for camera observation (future use)"
    TRANSIT: "Intermediate position for safe motion"
  
  # Joint limits (for validation)
  joint_limits:
    min: [-3.14159, -3.14159, -3.14159, -3.14159, -3.14159, -3.14159]
    max: [3.14159, 3.14159, 3.14159, 3.14159, 3.14159, 3.14159]