# Niryo Robot Position Configurations
# This file defines all physical positions and their corresponding joint angles
# for each Niryo robot in the testbed.
#
# Structure:
#   robot_<id>:
#     position_key:
#       joints: [j1, j2, j3, j4, j5, j6]  # Joint angles in radians
#       description: "Human-readable description"
#       type: PICKUP | DROP | HOME | HOLD | CAMERA | TRANSIT
#
# Note: All joint angles are in radians
# Note: Position keys (P11, D11, etc.) are physical identifiers used by robot controllers

robot_1:
  # Feeder Robot (R1) Configuration
  home_joints:
    joints: [0.002, 0.596, -1.008, -0.02, -0.994, -1.15]
    description: "Home position for Robot 1"
    type: HOME
  
  hold_joints:
    joints: [-0.0266,0.0615,-0.7824,-0.0075,-0.7041,-0.0321]
    description: "Hold position after pickup"
    type: HOLD
  
  # Pickup positions (feeder can pick from multiple locations)
  P11:
    joints: [-1.5911,-0.6549,-0.3325,0.0476,-0.5308,-0.276]
    description: "Pickup position - conveyor 1"
    type: PICKUP
  
  P12:
    joints: [-0.4238,-0.6337,-0.3946,0.0185,-0.5768,-0.8512]
    description: "Pickup position - conveyor 2"
    type: PICKUP
  
  P13:
    joints: [0.617, -0.534, -0.207, 0.008, -0.77, 0.072]
    description: "Pickup position - conveyor 3"
    type: PICKUP
  
  # Drop position (onto conveyor)
  D12:
    joints: [-0.509,-0.6322,-0.2552,0.0645,-0.7425,0.0859]
    description: "Drop position onto conveyor 2"
    type: DROP
  D13:
    joints: [0.6263,-0.5337,-0.4401,0.1059,-0.6765,-0.256]
    description: "Drop position onto conveyor 3"
    type: DROP
  D15:
    joints: [1.5105,-0.361,-0.7506,0.1151,-0.675,-0.253]
    description: "Drop position onto conveyor 5"
    type: DROP

  # Pre-grip positions (approach positions before pickup)
  pregrip_P11:
    joints: [-1.5165,-0.2671,-0.5204,-0.0091,-0.8698,-0.0091]
    description: "Pre-grip position for P11"
    type: TRANSIT
  
  pregrip_P12:
    joints: [-0.4238,-0.2747,-0.2659,0.0108,-1.0585,-0.842]
    description: "Pre-grip position for P12"
    type: TRANSIT
  
  pregrip_P13:
    joints: [0.617, -0.534, -0.207, 0.008, -0.77, 0.072]
    description: "Pre-grip position for P13"
    type: TRANSIT

