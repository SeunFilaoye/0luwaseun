# Niryo Robot Position Configurations
# This file defines all physical positions and their corresponding joint angles
# for each Niryo robot in the testbed.
#
# Structure:
#   robot_<id>:
#     position_key:
#       joints: [j1, j2, j3, j4, j5, j6]  # Joint angles in radians
#       description: "Human-readable description"
#       type: PICKUP | DROP | HOME | HOLD | CAMERA | TRANSIT
#
# Note: All joint angles are in radians
# Note: Position keys (P11, D11, etc.) are physical identifiers used by robot controllers

robot_1:
  # Feeder Robot (R1) Configuration
  home_joints:
    joints: [1.570, 0.522, -1.158, -0.038, -0.005, -0.012]
    description: "Home position for Robot 1"
    type: HOME
  
  hold_joints:
    joints: [2.077, -0.010, -0.323, -0.040, -1.223, -0.626]
    description: "Hold position after pickup"
    type: HOLD
  
  # Pickup positions (feeder can pick from multiple locations)
  P11:
    joints: [2.107, -0.878, 0.207, -0.228, -0.884, -0.419]
    description: "Pickup position - right side"
    type: PICKUP
  
  P12:
    joints: [2.342, -0.425, -0.587, 0.445, -0.856, -0.429]
    description: "Pickup position - left side 1"
    type: PICKUP
  
  P13:
    joints: [2.536, -0.672, -0.155, 0.511, -0.916, -0.449]
    description: "Pickup position - left side 2"
    type: PICKUP
  
  # Drop position (onto conveyor)
  D11:
    joints: [1.833, -0.441, -0.623, 0.114, -0.589, -0.506]
    description: "Drop position onto conveyor"
    type: DROP
  
  # Pre-grip positions (approach positions before pickup)
  pregrip_P11:
    joints: [2.179, -0.676, 0.211, -0.267, -1.108, -0.403]
    description: "Pre-grip position for P11"
    type: TRANSIT
  
  pregrip_P12:
    joints: [2.372, -0.197, -0.592, 0.339, -0.974, -0.429]
    description: "Pre-grip position for P12"
    type: TRANSIT
  
  pregrip_P13:
    joints: [2.498, -0.494, -0.142, 0.503, -0.996, -0.448]
    description: "Pre-grip position for P13"
    type: TRANSIT

