# =============================================================================
# AGV Vendor 2 ACL  (Alvik4 + Alvik5)
# =============================================================================
# Differences from agv_acl.yaml:
#   - shared_secret is unique to this fleet
#   - allowed_command_sources targets /agv_factory2/command
#   - publish/subscribe allow lists reference Alvik4/Alvik5 topics
#   - all deny rules are identical (peer-vendor isolation unchanged)

shared_secret: "agv2-secret-key-CHANGEME"

# Sources allowed to send commands to /agv_factory2/command
allowed_command_sources:
  - "/super_factory"

acl:

  publish:
    allow:
      - "/agv_factory2/status"
      - "/agv_factory2/ack"
      - "/Alvik4_cmd"
      - "/Alvik5_cmd"
      - "/fault_containment/violations"
      - "/super_factory/vendor_telemetry"

    deny:
      - "/niryo_factory/*"
      - "/robot_*"
      - "/lite6_factory/*"
      - "/xarm*"
      - "/agv_factory/status"
      - "/agv_factory/ack"
      - "/Alvik1_cmd"
      - "/Alvik2_cmd"
      - "/Alvik3_cmd"
      - "/super_factory/order"

  subscribe:
    allow:
      - "/agv_factory2/command"
      - "/Alvik4_status"
      - "/Alvik5_status"
      - "/fault_containment/violations"

    deny:
      - "/niryo_factory/*"
      - "/robot_*"
      - "/lite6_factory/*"
      - "/xarm*"
      - "/agv_factory/command"
