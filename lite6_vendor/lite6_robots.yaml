# ==================== SYSTEM METADATA ====================
metadata:
  version: "1.0"
  date: "2026-01-05"
  description: "Robot metadata for Lite6 warehouse ASRS system"
  
  # ==================== CAPABILITY DEFINITIONS ====================
  capabilities_definitions:
    pick: "Robot can pick objects using vacuum gripper"
    place: "Robot can place objects by deactivating vacuum"
    asrs_storage: "Robot can store items in assigned ASRS columns"
    asrs_retrieval: "Robot can retrieve items from assigned ASRS columns"
    agv_handoff: "Robot can hand off items to AGV"
  
  # ==================== ROLE DEFINITIONS ====================
  role_definitions:
    warehouse_handler_zone_1: "Manages ASRS columns 1-3 and interfaces"
    warehouse_handler_zone_2: "Manages ASRS columns 4-6 and interfaces"
  
  # ==================== ASRS SYSTEM LAYOUT ====================
  asrs_system:
    total_columns: 6
    total_rows: 10
    total_capacity: 60  # positions
    
    zone_1:
      robot: "xarm1"
      columns: [1, 2, 3]
      capacity: 30
    
    zone_2:
      robot: "xarm2"
      columns: [4, 5, 6]
      capacity: 30
  
  # ==================== HARDWARE CONSTRAINTS ====================
  hardware_constraints:
    vacuum_tool_id: 32
    max_payload_kg: 1.0
    max_reach_mm: 508
    joint_count: 6
    position_repeatability_mm: 0.05
  
  # ==================== SPEED RECOMMENDATIONS ====================
  speed_guidelines:
    fast_transit: 50.0      # For movements far from obstacles
    normal_operation: 30.0  # Standard pick/place operations
    precise_placement: 20.0 # Near ASRS slots or AGV
    teaching_mode: 10.0     # For manual teaching
  
  # ==================== COMMAND FORMAT ====================
  command_examples:
    pick_from_asrs: "PICK_ASRS_C2_R5"      # Pick from Column 2, Row 5
    store_to_asrs: "STORE_ASRS_C4_R8"      # Store to Column 4, Row 8
    handoff_to_agv: "HANDOFF_AGV"          # Drop at AGV position
    pick_from_conveyor: "PICK_CONVEYOR"    # Pick from conveyor (future)
    go_home: "GO_HOME"                     # Return to home position
  
  # ==================== POSITION NAMING CONVENTION ====================
  naming_convention:
    asrs_positions: "asrs_c<column>_r<row>"
    example: "asrs_c3_r7 = Column 3, Row 7"
    conveyor_positions: "conveyor_<action>"
    agv_positions: "agv_<action>"
    transit_positions: "<location>_approach"
  
  # ==================== NOTES ====================
  notes:
    - "Both robots share the same ROS2 namespace '/ufactory' but different IPs"
    - "Position keys reference lite6_positions.yaml for actual joint angles"
    - "ASRS columns are physically divided between robots for efficiency"
    - "Conveyor positions are placeholders for future integration"
    - "Each robot can independently access AGV drop position"
    - "Factory node coordinates which robot handles which request"
  
  # ==================== SAFETY GUIDELINES ====================
  safety:
    - "Always verify vacuum activation before lifting"
    - "Return to home position when idle"
    - "Use slower speeds near ASRS slots to prevent collisions"
    - "Ensure proper settling time after position changes"
    - "Monitor vacuum pressure for successful grip confirmation"
