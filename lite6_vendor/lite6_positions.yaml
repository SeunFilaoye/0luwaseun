# ==================== METADATA ====================
metadata:
  version: "2.0"
  date: "2026-02-03"
  pose_format: "[X, Y, Z, Roll, Pitch, Yaw]"
  linear_units: "mm"
  angular_units: "degrees"
  
  position_types:
    HOME: "Default safe starting position"
    TRANSIT: "Intermediate position for collision-free motion"
    ASRS_PICKUP: "Position to pick/place from ASRS carousel"
    CONVEYOR_PICKUP: "Position to pick from conveyor"
    AGV_DROP: "Position to drop onto AGV"
  
  teaching_instructions:
    - "Use xArm Studio to record TCP pose (not joint angles)"
    - "Command: arm.get_position() returns [X, Y, Z, Roll, Pitch, Yaw]"
    - "Test positions at 20-30% speed before production use"
    - "Verify gripper clearance at each ASRS row"
