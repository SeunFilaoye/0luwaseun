# Lite6 Robot Position Configurations
# This file defines all physical positions and their corresponding joint angles
# for each Lite6 robot in the warehouse system.
#
# Structure:
#   xarm<id>:
#     position_key:
#       joints: [j1, j2, j3, j4, j5, j6, j7]  # Joint angles in radians
#       description: "Human-readable description"
#       type: HOME | ASRS_PICKUP | ASRS_DROP | CONVEYOR_PICKUP | AGV_DROP | TRANSIT
#
# Note: All joint angles are in radians
# Note: Lite6 has 6 DOF, but we keep 7 values for compatibility (last value is 0.0)

